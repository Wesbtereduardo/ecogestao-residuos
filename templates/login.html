
{% extends "base.html" %}
{% block title %}Entrar | EcoGestão{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 text-success text-center">♻ EcoGestão</h1>
                <p class="text-muted text-center">Acesse o sistema de gerenciamento</p>
                <form method="post">
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuário</label>
                        <input id="usuario" name="usuario" class="form-control" required autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input id="senha" name="senha" type="password" class="form-control" required autocomplete="current-password">
                    </div>
                    <button class="btn btn-success w-100" type="submit">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
